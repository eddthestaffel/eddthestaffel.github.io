<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/png" href="images/meow_zedong.png">

</head>

<body>

    <header>
        <h1>Logística de Tanques</h1>
        <p>Registro y administración de tanques</p>
    </header>

    <main>

        <section>
            <h2>Registrar tanque</h2>

            <form id="formularioTanque">

                <label for="id">Número de serie:</label>
                <input type="text" id="id" name="id" required>

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="generacion">Generación:</label>
                <input type="number" id="generacion" name="generacion" min="1" required>

                <label for="pais">País de fabricación:</label>
                <input type="text" id="pais" name="pais" required>

                <button type="submit">Guardar tanque</button>

            </form>
        </section>

        <hr>

        <section>
            <h2>Tanques registrados</h2>

            <table border="1">

                <thead>
                    <tr>
                        <th>ID / Número de serie</th>
                        <th>Nombre</th>
                        <th>Generación</th>
                        <th>País de fabricación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tablaTanques">
                    <!-- Los tanques aparecerán aquí mediante JavaScript -->
                </tbody>

            </table>
        </section>

        <br>

        <a href="../index.html">Volver al inicio</a>

    </main>

    <script src="systema.js"></script>

</body>

</html>
