<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cloud Computing</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/png" href="images/meow_zedong.png">

</head>

<body>
    <h1>Logistica de tanques</h1>
    <p>Registro y administración de tanques</p>

    <form id="formularioTanque">
        <label for="id">Número de serie:</label>
        <input type="text" id="id" required>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>

        <label for="generacion">Generación:</label>
        <input type="number" id="generacion" min="1" required>

        <label for="pais">País de fabricación:</label>
        <input type="text" id="pais" required>

        <button type="submit">Guardar tanque</button>
    </form>

    <hr>

    <h2>Tanques registrados</h2>

    <table border="1">

        <thead>
            <tr>
                <th>ID / Número de serie</th>
                <th>Nombre</th>
                <th>Generación</th>
                <th>País de fabricación</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tablaTanques">
            <!-- Los tanques aparecerán aquí -->
        </tbody>

    </table>

    <br>

    <a href="../index.html">Volver al inicio</a>

    <script src="sistema.js"></script>

</body>

</html>
